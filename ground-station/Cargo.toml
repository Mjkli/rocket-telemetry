[package]
name = "ground-station"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
log = "0.4.34"
postcard = { version = "1.1.3", features=["heapless"] }
protocol = { path = "../libraries/protocol" }
serialport = { version = "4.10.1", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "net", "sync", "rt-multi-thread"] }

websocket_server = { path = "../libraries/websocket/server"}


[dev-dependencies]
rand = "0.10.3"
